# SQL queries for the admin API
create_admin: |
  INSERT INTO divine_admin_users(id, full_name, employee_id, email, password_hash, created_by, created_date, last_updated_by, last_updated_date)
  VALUES (:id, :full_name, :employee_id, :email, :password_hash, :created_by, :created_date, :last_updated_by, :last_updated_date)
  RETURNING *;
get_by_email: |
  SELECT * FROM divine_admin_users WHERE lower(email) = lower(:email) LIMIT 1;
get_by_employee_id: |
  SELECT * FROM divine_admin_users WHERE lower(employee_id) = lower(:employee_id) LIMIT 1;
get_by_id: |
  SELECT * FROM divine_admin_users WHERE id = :id LIMIT 1;
