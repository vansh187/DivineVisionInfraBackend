# SQL queries for project inventory search + browsing-event tracking
upsert_unit: |
  INSERT INTO divine_project_inventory(
    id, project_name, city, locality, block, unit_number, unit_type,
    width_mtr, length_mtr, area_sqmt, area_sqyd, status, created_date, last_updated_date
  )
  VALUES (
    :id, :project_name, :city, :locality, :block, :unit_number, :unit_type,
    :width_mtr, :length_mtr, :area_sqmt, :area_sqyd, :status, :created_date, :last_updated_date
  )
  ON CONFLICT (project_name, unit_number) DO UPDATE SET
    city = EXCLUDED.city,
    locality = EXCLUDED.locality,
    block = EXCLUDED.block,
    unit_type = EXCLUDED.unit_type,
    width_mtr = EXCLUDED.width_mtr,
    length_mtr = EXCLUDED.length_mtr,
    area_sqmt = EXCLUDED.area_sqmt,
    area_sqyd = EXCLUDED.area_sqyd,
    -- A re-ingest only sets the status of plots still 'available' (or new).
    -- Booked / KYC-held / broker-reserved plots, offline sales ('sold') and
    -- client holds ('held') keep theirs - statuses come from
    -- scripts/sync_inventory_from_sheet.py and the booking flow, not from here.
    status = CASE WHEN divine_project_inventory.status = 'available'
                  THEN EXCLUDED.status ELSE divine_project_inventory.status END,
    last_updated_date = EXCLUDED.last_updated_date
  RETURNING *;

search_units: |
  SELECT * FROM divine_project_inventory
  WHERE (:status IS NOT NULL OR status = 'available')
    AND (:project_name IS NULL OR lower(project_name) LIKE '%' || lower(:project_name) || '%')
    AND (:city IS NULL OR lower(city) LIKE '%' || lower(:city) || '%')
    AND (:unit_type IS NULL OR lower(unit_type) = lower(:unit_type))
    AND (:status IS NULL OR lower(status) = lower(:status))
    AND (:min_area_sqyd IS NULL OR area_sqyd >= :min_area_sqyd)
    AND (:max_area_sqyd IS NULL OR area_sqyd <= :max_area_sqyd)
  ORDER BY project_name ASC, area_sqyd ASC
  LIMIT :limit OFFSET :offset;

get_unit_by_id: |
  SELECT * FROM divine_project_inventory WHERE id = :id;

distinct_plot_sizes: |
  SELECT
    project_name,
    city,
    unit_type,
    area_sqyd,
    area_sqmt,
    width_mtr,
    length_mtr,
    COUNT(*) AS unit_count,
    SUM(CASE WHEN status = 'available' THEN 1 ELSE 0 END) AS available_count
  FROM divine_project_inventory
  WHERE (:project_name IS NULL OR lower(project_name) LIKE '%' || lower(:project_name) || '%')
    AND (:unit_type IS NULL OR lower(unit_type) = lower(:unit_type))
  GROUP BY project_name, city, unit_type, area_sqyd, area_sqmt, width_mtr, length_mtr
  ORDER BY project_name ASC, area_sqyd ASC;

record_event: |
  INSERT INTO divine_inventory_events(id, inventory_id, lead_id, session_id, event_type, created_date)
  VALUES (:id, :inventory_id, :lead_id, :session_id, :event_type, :created_date)
  RETURNING *;

list_events_for_lead: |
  SELECT e.*, u.project_name, u.city, u.locality, u.unit_type, u.area_sqyd, u.status AS unit_status
  FROM divine_inventory_events e
  JOIN divine_project_inventory u ON u.id = e.inventory_id
  WHERE e.lead_id = :lead_id
  ORDER BY e.created_date DESC
  LIMIT :limit;

list_recent_available_units: |
  SELECT * FROM divine_project_inventory
  WHERE status = 'available'
  ORDER BY created_date DESC
  LIMIT :limit;

expire_stale_units: |
  UPDATE divine_project_inventory
  SET status = 'available', reserved_by_broker_id = NULL, reserved_at = NULL, reserved_until = NULL,
      last_updated_date = :now
  WHERE status = 'reserved' AND reserved_until < :now
  RETURNING id, project_name, unit_number, status;

expire_stale_reservation_history: |
  UPDATE divine_inventory_reservations
  SET outcome = 'expired', ended_at = :now
  WHERE outcome = 'active' AND expires_at < :now;

reserve_unit: |
  UPDATE divine_project_inventory
  SET status = 'reserved', reserved_by_broker_id = :broker_id,
      reserved_at = :reserved_at, reserved_until = :reserved_until,
      last_updated_date = :reserved_at
  WHERE id = :id AND status = 'available'
  RETURNING *;

insert_reservation_history: |
  INSERT INTO divine_inventory_reservations(id, inventory_id, broker_id, reserved_at, expires_at, outcome, created_date)
  VALUES (:id, :inventory_id, :broker_id, :reserved_at, :expires_at, 'active', :reserved_at)
  RETURNING *;

release_reservation: |
  UPDATE divine_project_inventory
  SET status = :target_status, reserved_by_broker_id = NULL, reserved_at = NULL, reserved_until = NULL,
      last_updated_date = :ended_at
  WHERE id = :id AND reserved_by_broker_id = :broker_id AND status = 'reserved'
  RETURNING *;

close_reservation_history: |
  UPDATE divine_inventory_reservations
  SET outcome = :outcome, ended_at = :ended_at
  WHERE inventory_id = :inventory_id AND broker_id = :broker_id AND outcome = 'active';

list_reservations_for_broker: |
  SELECT * FROM divine_project_inventory
  WHERE status = 'reserved' AND reserved_by_broker_id = :broker_id
  ORDER BY reserved_until ASC;

# The status change: only an 'available' plot. A re-run by the payment that
# already booked it is book_unit_rerun (same columns, status unchanged), kept
# separate so only a real change writes a status-history row.
book_unit: |
  UPDATE divine_project_inventory
  SET status = 'booked',
      booked_at = :now,
      booked_payment_id = :payment_id,
      booked_by = :customer_id,
      reserved_by_broker_id = NULL,
      reserved_at = NULL,
      reserved_until = NULL,
      last_updated_date = :now
  WHERE id = :id AND status = 'available'
  RETURNING *;

book_unit_rerun: |
  UPDATE divine_project_inventory
  SET status = 'booked',
      booked_at = :now,
      booked_payment_id = :payment_id,
      booked_by = :customer_id,
      reserved_by_broker_id = NULL,
      reserved_at = NULL,
      reserved_until = NULL,
      last_updated_date = :now
  WHERE id = :id AND status = 'booked' AND booked_payment_id = :payment_id
  RETURNING *;

unbook_unit: |
  UPDATE divine_project_inventory
  SET status = 'available',
      booked_at = NULL,
      booked_payment_id = NULL,
      booked_by = NULL,
      last_updated_date = :now
  WHERE id = :id AND status = 'booked'
  RETURNING *;

# Same effect as unbook_unit, but only for the SAME payment currently holding the
# unit - used by the admin Cancel-a-booked-plot path, which (unlike approve()'s
# narrow version-conflict rollback via plain unbook_unit) is reachable any time
# for any booking id, so it must not release a unit some other payment now owns.
unbook_unit_for_payment: |
  UPDATE divine_project_inventory
  SET status = 'available',
      booked_at = NULL,
      booked_payment_id = NULL,
      booked_by = NULL,
      last_updated_date = :now
  WHERE id = :id AND status = 'booked' AND booked_payment_id = :payment_id
  RETURNING *;

# ---- Booking KYC review (see Divinepersistence/persistence_booking.py) ----
# Payment settlement now HOLDS the unit for admin KYC review instead of
# immediately booking it - book_unit (above) is unchanged/still used by the
# broker-confirms-cash flow, which has no KYC review step.
# Same split as book_unit / book_unit_rerun.
hold_for_kyc_review: |
  UPDATE divine_project_inventory
  SET status = 'pending_kyc_review',
      booked_at = :now,
      booked_payment_id = :payment_id,
      booked_by = :customer_id,
      reserved_by_broker_id = NULL,
      reserved_at = NULL,
      reserved_until = NULL,
      last_updated_date = :now
  WHERE id = :id AND status = 'available'
  RETURNING *;

hold_for_kyc_review_rerun: |
  UPDATE divine_project_inventory
  SET status = 'pending_kyc_review',
      booked_at = :now,
      booked_payment_id = :payment_id,
      booked_by = :customer_id,
      reserved_by_broker_id = NULL,
      reserved_at = NULL,
      reserved_until = NULL,
      last_updated_date = :now
  WHERE id = :id AND status = 'pending_kyc_review' AND booked_payment_id = :payment_id
  RETURNING *;

confirm_booking_after_kyc: |
  UPDATE divine_project_inventory
  SET status = 'booked',
      last_updated_date = :now
  WHERE id = :id AND status = 'pending_kyc_review' AND booked_payment_id = :payment_id
  RETURNING *;

release_from_kyc_review: |
  UPDATE divine_project_inventory
  SET status = 'available',
      booked_at = NULL,
      booked_payment_id = NULL,
      booked_by = NULL,
      last_updated_date = :now
  WHERE id = :id AND status = 'pending_kyc_review' AND booked_payment_id = :payment_id
  RETURNING *;

# ---- Status history (divine_inventory_status_log) -------------------------
# upsert_unit reads this first: whether the plot is new, and the status an
# update starts from.
get_unit_status_by_project_unit: |
  SELECT id, project_name, unit_number, status FROM divine_project_inventory
  WHERE project_name = :project_name AND unit_number = :unit_number;

# ---- Admin panel: Inventory section --------------------------------------
# Plot counts per (project, status); the service turns them into one row per
# project with a count for every status in INVENTORY_STATUSES.
admin_project_status_counts: |
  SELECT project_name, status, COUNT(*) AS plots
  FROM divine_project_inventory
  GROUP BY project_name, status
  ORDER BY project_name ASC;

# Plot number order: block first, then shorter numbers before longer ones so
# "A-9" sorts before "A-10". The search escapes '\', '%' and '_' (ESCAPE '\')
# so the admin's text is matched literally, not as LIKE wildcards. Each plot's
# latest change comes from admin_latest_changes, for this page's ids only.
admin_list_units: |
  SELECT u.*
  FROM divine_project_inventory u
  WHERE (:project_name IS NULL OR u.project_name = :project_name)
    AND (:status IS NULL OR u.status = :status)
    AND (:search IS NULL
         OR lower(u.unit_number) LIKE '%' || replace(replace(replace(lower(:search), '\', '\\'), '%', '\%'), '_', '\_') || '%' ESCAPE '\'
         OR lower(COALESCE(u.block, '')) LIKE '%' || replace(replace(replace(lower(:search), '\', '\\'), '%', '\%'), '_', '\_') || '%' ESCAPE '\')
  ORDER BY COALESCE(u.block, '') ASC, LENGTH(u.unit_number) ASC, u.unit_number ASC
  LIMIT :limit OFFSET :offset;

admin_count_units: |
  SELECT COUNT(*) AS total
  FROM divine_project_inventory u
  WHERE (:project_name IS NULL OR u.project_name = :project_name)
    AND (:status IS NULL OR u.status = :status)
    AND (:search IS NULL
         OR lower(u.unit_number) LIKE '%' || replace(replace(replace(lower(:search), '\', '\\'), '%', '\%'), '_', '\_') || '%' ESCAPE '\'
         OR lower(COALESCE(u.block, '')) LIKE '%' || replace(replace(replace(lower(:search), '\', '\\'), '%', '\%'), '_', '\_') || '%' ESCAPE '\');

# Newest status-log row of each plot on one page (:ids expanded in Python).
admin_latest_changes: |
  SELECT inventory_id, changed_at, changed_by_name FROM (
    SELECT inventory_id, changed_at, changed_by_name,
      ROW_NUMBER() OVER (PARTITION BY inventory_id ORDER BY changed_at DESC, id DESC) AS rn
    FROM divine_inventory_status_log
    WHERE inventory_id IN :ids
  ) latest
  WHERE rn = 1;

admin_status_history: |
  SELECT * FROM divine_inventory_status_log
  WHERE inventory_id = :inventory_id
  ORDER BY changed_at DESC, id DESC;

# Manual change from the admin panel. Only between the manual statuses
# (:manual_statuses = MANUAL_INVENTORY_STATUSES, expanded in Python), only while the plot is still at the status the admin was looking at
# (:expected_status), and never for a plot tied to a booking payment or an
# offline buyer - those move through the booking / import flows.
admin_set_status: |
  UPDATE divine_project_inventory
  SET status = :new_status,
      sale_source = CASE WHEN :new_status = 'sold' THEN COALESCE(sale_source, 'offline') ELSE NULL END,
      status_note = :note,
      status_updated_at = :now,
      last_updated_date = :now
  WHERE id = :id
    AND status = :expected_status
    AND status IN :manual_statuses
    AND booked_payment_id IS NULL
    AND booked_by IS NULL
  RETURNING *;
