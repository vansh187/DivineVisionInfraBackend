# SQL queries for project inventory search + browsing-event tracking
upsert_unit: |
  INSERT INTO divine_project_inventory(
    id, project_name, city, locality, block, unit_number, unit_type,
    width_mtr, length_mtr, area_sqmt, area_sqyd, status, created_date, last_updated_date
  )
  VALUES (
    :id, :project_name, :city, :locality, :block, :unit_number, :unit_type,
    :width_mtr, :length_mtr, :area_sqmt, :area_sqyd, :status, :created_date, :last_updated_date
  )
  ON CONFLICT (project_name, unit_number) DO UPDATE SET
    city = EXCLUDED.city,
    locality = EXCLUDED.locality,
    block = EXCLUDED.block,
    unit_type = EXCLUDED.unit_type,
    width_mtr = EXCLUDED.width_mtr,
    length_mtr = EXCLUDED.length_mtr,
    area_sqmt = EXCLUDED.area_sqmt,
    area_sqyd = EXCLUDED.area_sqyd,
    status = EXCLUDED.status,
    last_updated_date = EXCLUDED.last_updated_date
  RETURNING *;

search_units: |
  SELECT * FROM divine_project_inventory
  WHERE (:status IS NOT NULL OR status = 'available')
    AND (:project_name IS NULL OR lower(project_name) LIKE '%' || lower(:project_name) || '%')
    AND (:city IS NULL OR lower(city) LIKE '%' || lower(:city) || '%')
    AND (:unit_type IS NULL OR lower(unit_type) = lower(:unit_type))
    AND (:status IS NULL OR lower(status) = lower(:status))
    AND (:min_area_sqyd IS NULL OR area_sqyd >= :min_area_sqyd)
    AND (:max_area_sqyd IS NULL OR area_sqyd <= :max_area_sqyd)
  ORDER BY project_name ASC, area_sqyd ASC
  LIMIT :limit OFFSET :offset;

get_unit_by_id: |
  SELECT * FROM divine_project_inventory WHERE id = :id;

distinct_plot_sizes: |
  SELECT
    project_name,
    city,
    unit_type,
    area_sqyd,
    area_sqmt,
    width_mtr,
    length_mtr,
    COUNT(*) AS unit_count,
    SUM(CASE WHEN status = 'available' THEN 1 ELSE 0 END) AS available_count
  FROM divine_project_inventory
  WHERE (:project_name IS NULL OR lower(project_name) LIKE '%' || lower(:project_name) || '%')
    AND (:unit_type IS NULL OR lower(unit_type) = lower(:unit_type))
  GROUP BY project_name, city, unit_type, area_sqyd, area_sqmt, width_mtr, length_mtr
  ORDER BY project_name ASC, area_sqyd ASC;

record_event: |
  INSERT INTO divine_inventory_events(id, inventory_id, lead_id, session_id, event_type, created_date)
  VALUES (:id, :inventory_id, :lead_id, :session_id, :event_type, :created_date)
  RETURNING *;

list_events_for_lead: |
  SELECT e.*, u.project_name, u.city, u.locality, u.unit_type, u.area_sqyd, u.status AS unit_status
  FROM divine_inventory_events e
  JOIN divine_project_inventory u ON u.id = e.inventory_id
  WHERE e.lead_id = :lead_id
  ORDER BY e.created_date DESC
  LIMIT :limit;

list_recent_available_units: |
  SELECT * FROM divine_project_inventory
  WHERE status = 'available'
  ORDER BY created_date DESC
  LIMIT :limit;

expire_stale_units: |
  UPDATE divine_project_inventory
  SET status = 'available', reserved_by_broker_id = NULL, reserved_at = NULL, reserved_until = NULL,
      last_updated_date = :now
  WHERE status = 'reserved' AND reserved_until < :now;

expire_stale_reservation_history: |
  UPDATE divine_inventory_reservations
  SET outcome = 'expired', ended_at = :now
  WHERE outcome = 'active' AND expires_at < :now;

reserve_unit: |
  UPDATE divine_project_inventory
  SET status = 'reserved', reserved_by_broker_id = :broker_id,
      reserved_at = :reserved_at, reserved_until = :reserved_until,
      last_updated_date = :reserved_at
  WHERE id = :id AND status = 'available'
  RETURNING *;

insert_reservation_history: |
  INSERT INTO divine_inventory_reservations(id, inventory_id, broker_id, reserved_at, expires_at, outcome, created_date)
  VALUES (:id, :inventory_id, :broker_id, :reserved_at, :expires_at, 'active', :reserved_at)
  RETURNING *;

release_reservation: |
  UPDATE divine_project_inventory
  SET status = :target_status, reserved_by_broker_id = NULL, reserved_at = NULL, reserved_until = NULL,
      last_updated_date = :ended_at
  WHERE id = :id AND reserved_by_broker_id = :broker_id AND status = 'reserved'
  RETURNING *;

close_reservation_history: |
  UPDATE divine_inventory_reservations
  SET outcome = :outcome, ended_at = :ended_at
  WHERE inventory_id = :inventory_id AND broker_id = :broker_id AND outcome = 'active';

list_reservations_for_broker: |
  SELECT * FROM divine_project_inventory
  WHERE status = 'reserved' AND reserved_by_broker_id = :broker_id
  ORDER BY reserved_until ASC;

book_unit: |
  UPDATE divine_project_inventory
  SET status = 'booked',
      booked_at = :now,
      booked_payment_id = :payment_id,
      booked_by = :customer_id,
      reserved_by_broker_id = NULL,
      reserved_at = NULL,
      reserved_until = NULL,
      last_updated_date = :now
  WHERE id = :id
    AND (
      status IN ('available', 'held')
      OR (status = 'booked' AND booked_payment_id = :payment_id)
    )
  RETURNING *;

unbook_unit: |
  UPDATE divine_project_inventory
  SET status = 'available',
      booked_at = NULL,
      booked_payment_id = NULL,
      booked_by = NULL,
      last_updated_date = :now
  WHERE id = :id AND status = 'booked'
  RETURNING *;

# ---- Booking KYC review (see Divinepersistence/persistence_booking.py) ----
# Payment settlement now HOLDS the unit for admin KYC review instead of
# immediately booking it - book_unit (above) is unchanged/still used by the
# broker-confirms-cash flow, which has no KYC review step.
hold_for_kyc_review: |
  UPDATE divine_project_inventory
  SET status = 'pending_kyc_review',
      booked_at = :now,
      booked_payment_id = :payment_id,
      booked_by = :customer_id,
      reserved_by_broker_id = NULL,
      reserved_at = NULL,
      reserved_until = NULL,
      last_updated_date = :now
  WHERE id = :id
    AND (
      status IN ('available', 'held')
      OR (status = 'pending_kyc_review' AND booked_payment_id = :payment_id)
    )
  RETURNING *;

confirm_booking_after_kyc: |
  UPDATE divine_project_inventory
  SET status = 'booked',
      last_updated_date = :now
  WHERE id = :id AND status = 'pending_kyc_review' AND booked_payment_id = :payment_id
  RETURNING *;

release_from_kyc_review: |
  UPDATE divine_project_inventory
  SET status = 'available',
      booked_at = NULL,
      booked_payment_id = NULL,
      booked_by = NULL,
      last_updated_date = :now
  WHERE id = :id AND status = 'pending_kyc_review' AND booked_payment_id = :payment_id
  RETURNING *;
