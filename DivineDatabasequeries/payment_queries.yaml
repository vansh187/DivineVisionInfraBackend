# SQL queries for the payments API
create_payment: |
  INSERT INTO divine_payments(id, owner_id, owner_role, amount, currency, status, method, purpose, inventory_id, installment_no, due_date, zoho_payments_session_id, utr_number, notes, created_date, last_updated_date)
  VALUES (:id, :owner_id, :owner_role, :amount, :currency, :status, :method, :purpose, :inventory_id, :installment_no, :due_date, :zoho_payments_session_id, :utr_number, :notes, :created_date, :last_updated_date)
  RETURNING *;
get_by_id: |
  SELECT * FROM divine_payments WHERE id = :id LIMIT 1;
get_by_zoho_session_id: |
  SELECT * FROM divine_payments WHERE zoho_payments_session_id = :zoho_payments_session_id LIMIT 1;
update_payment_status: |
  UPDATE divine_payments SET status = :status, zoho_payment_id = :zoho_payment_id,
  zoho_signature = :zoho_signature, last_updated_date = :last_updated_date
  WHERE id = :id RETURNING *;
flag_manual_review: |
  UPDATE divine_payments SET needs_manual_review = true, manual_review_reason = :reason,
  last_updated_date = :last_updated_date
  WHERE id = :id RETURNING *;
update_refund_status: |
  UPDATE divine_payments SET refund_status = :refund_status, refund_amount = :refund_amount,
  zoho_refund_id = :zoho_refund_id, refund_initiated_date = :refund_initiated_date,
  refund_completed_date = :refund_completed_date, refund_note = :refund_note,
  last_updated_date = :last_updated_date
  WHERE id = :id RETURNING *;

# Atomic compare-and-swap for POST /admin/payments/{id}/refund/retry - flips
# 'pending' -> 'processing' ONLY when it's still 'pending' with no
# zoho_refund_id, so two concurrent retry requests for the same stuck refund
# can never both pass and both call the Zoho gateway; the loser gets no row
# back and is refused. 'processing' here is a short-lived claim marker, not a
# persisted gateway state - the same call immediately finalizes it to
# 'completed' or back to 'pending' once the gateway attempt returns. Legacy
# 'razorpay' rows are deliberately excluded - that gateway was retired at
# cutover, so a razorpay refund can never be gateway-retried again; it goes
# through mark_refund_collected (manual bookkeeping) instead.
claim_refund_retry: |
  UPDATE divine_payments SET refund_status = 'processing', last_updated_date = :now
  WHERE id = :id AND method = 'zoho' AND refund_status = 'pending' AND zoho_refund_id IS NULL
  RETURNING *;

# Admin confirms a cash/rtgs_neft/legacy-razorpay refund (no gateway to call
# for any of these three - razorpay's gateway was retired at cutover, so its
# refunds are handled the same manual way as cash/rtgs_neft from here on) was
# actually paid out - atomic compare-and-swap, only applies while still a
# manual-refund method with a refund in flight, so it can never mark a live
# 'zoho' refund "collected" or double-apply to an already-completed one.
mark_refund_collected: |
  UPDATE divine_payments SET refund_status = 'completed', refund_completed_date = :now,
  refund_note = :note, last_updated_date = :now
  WHERE id = :id AND method IN ('cash', 'rtgs_neft', 'razorpay') AND refund_status IN ('pending', 'processing')
  RETURNING *;
