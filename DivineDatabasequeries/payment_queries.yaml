# SQL queries for the payments API
create_payment: |
  INSERT INTO divine_payments(id, owner_id, owner_role, amount, currency, status, method, purpose, inventory_id, installment_no, due_date, razorpay_order_id, utr_number, notes, created_date, last_updated_date)
  VALUES (:id, :owner_id, :owner_role, :amount, :currency, :status, :method, :purpose, :inventory_id, :installment_no, :due_date, :razorpay_order_id, :utr_number, :notes, :created_date, :last_updated_date)
  RETURNING *;
get_by_id: |
  SELECT * FROM divine_payments WHERE id = :id LIMIT 1;
get_by_razorpay_order_id: |
  SELECT * FROM divine_payments WHERE razorpay_order_id = :razorpay_order_id LIMIT 1;
update_payment_status: |
  UPDATE divine_payments SET status = :status, razorpay_payment_id = :razorpay_payment_id,
  razorpay_signature = :razorpay_signature, last_updated_date = :last_updated_date
  WHERE id = :id RETURNING *;
flag_manual_review: |
  UPDATE divine_payments SET needs_manual_review = true, manual_review_reason = :reason,
  last_updated_date = :last_updated_date
  WHERE id = :id RETURNING *;
update_refund_status: |
  UPDATE divine_payments SET refund_status = :refund_status, refund_amount = :refund_amount,
  razorpay_refund_id = :razorpay_refund_id, refund_initiated_date = :refund_initiated_date,
  refund_completed_date = :refund_completed_date, refund_note = :refund_note,
  last_updated_date = :last_updated_date
  WHERE id = :id RETURNING *;

# Atomic compare-and-swap for POST /admin/payments/{id}/refund/retry - flips
# 'pending' -> 'processing' ONLY when it's still 'pending' with no
# razorpay_refund_id, so two concurrent retry requests for the same stuck
# refund can never both pass and both call the Razorpay gateway; the loser
# gets no row back and is refused. 'processing' here is a short-lived claim
# marker, not a persisted gateway state - the same call immediately finalizes
# it to 'completed' or back to 'pending' once the gateway attempt returns.
claim_refund_retry: |
  UPDATE divine_payments SET refund_status = 'processing', last_updated_date = :now
  WHERE id = :id AND method = 'razorpay' AND refund_status = 'pending' AND razorpay_refund_id IS NULL
  RETURNING *;