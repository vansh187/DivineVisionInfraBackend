# SQL queries for the customer API
create_customer: |
  INSERT INTO divine_customer_users(id, username, first_name, last_name, email, phone, password_hash, created_by, created_date, last_updated_by, last_updated_date)
  VALUES (:id, :username, :first_name, :last_name, :email, :phone, :password_hash, :created_by, :created_date, :last_updated_by, :last_updated_date)
  RETURNING *;
get_by_username: |
  SELECT * FROM divine_customer_users WHERE username = :username LIMIT 1;
get_by_email: |
  SELECT * FROM divine_customer_users WHERE lower(email) = lower(:email) LIMIT 1;
get_by_id: |
  SELECT * FROM divine_customer_users WHERE id = :id LIMIT 1;

# ---- Customer profile assembly (GET /customer/profile) --------------------
profile_get_customer: |
  SELECT id, username, email, phone, first_name, last_name
  FROM divine_customer_users
  WHERE id = :customer_id
  LIMIT 1;
profile_get_identity_extract: |
  SELECT extracted_data
  FROM divine_kyc_verifications
  WHERE owner_id = :customer_id
    AND owner_role = 'customer'
    AND verified = :verified
  ORDER BY created_date DESC
  LIMIT 1;
profile_get_booking_application: |
  SELECT d.id, d.project_id, d.payment_id, d.form_data, d.created_date,
         p.inventory_id,
         p.amount AS booking_payment_amount,
         p.method AS payment_method,
         p.razorpay_order_id,
         p.razorpay_payment_id,
         p.created_date AS payment_created_date
  FROM divine_documents d
  LEFT JOIN divine_payments p
    ON p.id = d.payment_id
   AND p.owner_id = d.owner_id
   AND p.owner_role = d.owner_role
  WHERE d.owner_id = :customer_id
    AND d.owner_role = 'customer'
    AND d.document_type IN ('booking_application', 'project_booking_application')
  ORDER BY d.created_date DESC
  LIMIT 1;
profile_list_booking_applications: |
  SELECT d.id, d.project_id, d.payment_id, d.form_data, d.created_date,
         p.inventory_id,
         p.amount AS booking_payment_amount,
         p.method AS payment_method,
         p.razorpay_order_id,
         p.razorpay_payment_id,
         p.created_date AS payment_created_date
  FROM divine_documents d
  LEFT JOIN divine_payments p
    ON p.id = d.payment_id
   AND p.owner_id = d.owner_id
   AND p.owner_role = d.owner_role
  WHERE d.owner_id = :customer_id
    AND d.owner_role = 'customer'
    AND d.document_type IN ('booking_application', 'project_booking_application')
  ORDER BY d.created_date DESC;
profile_get_amount_received: |
  SELECT COALESCE(SUM(amount), 0) AS amount_received
  FROM divine_payments
  WHERE owner_id = :customer_id
    AND owner_role = 'customer'
    AND status = 'paid';
profile_get_amount_received_for_payment: |
  SELECT COALESCE(SUM(amount), 0) AS amount_received
  FROM divine_payments
  WHERE owner_id = :customer_id
    AND owner_role = 'customer'
    AND status = 'paid'
    AND id = :payment_id;
profile_count_booking_projects: |
  SELECT COUNT(DISTINCT project_id) AS project_count
  FROM divine_documents
  WHERE owner_id = :customer_id
    AND owner_role = 'customer'
    AND document_type IN ('booking_application', 'project_booking_application')
    AND project_id IS NOT NULL;
profile_get_amount_received_for_project: |
  SELECT COALESCE(SUM(amount), 0) AS amount_received
  FROM divine_payments
  WHERE owner_id = :customer_id
    AND owner_role = 'customer'
    AND status = 'paid'
    AND id IN (
      SELECT payment_id
      FROM divine_documents
      WHERE owner_id = :customer_id
        AND owner_role = 'customer'
        AND document_type IN ('booking_application', 'project_booking_application')
        AND project_id = :project_id
        AND payment_id IS NOT NULL
    );
