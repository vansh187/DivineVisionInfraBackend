# SQL queries for the customer API
create_customer: |
  INSERT INTO divine_customer_users(id, username, first_name, last_name, email, phone, password_hash, created_by, created_date, last_updated_by, last_updated_date)
  VALUES (:id, :username, :first_name, :last_name, :email, :phone, :password_hash, :created_by, :created_date, :last_updated_by, :last_updated_date)
  RETURNING *;
get_by_username: |
  SELECT * FROM divine_customer_users WHERE username = :username LIMIT 1;
get_by_email: |
  SELECT * FROM divine_customer_users WHERE lower(email) = lower(:email) LIMIT 1;
get_by_id: |
  SELECT * FROM divine_customer_users WHERE id = :id LIMIT 1;
