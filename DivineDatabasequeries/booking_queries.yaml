# SQL for the Booking KYC review workflow (divine_bookings + divine_booking_decisions).
# See Divinepersistence/persistence_booking.py.
#
# The search filter escapes '%' and '_' in :search before it's wrapped in
# wildcards (ESCAPE '\') so a literal underscore/percent in a customer id or
# project name is matched literally instead of acting as a LIKE wildcard.
# Search matches the booking id, customer id, or project name - there's no
# customer-name column on this table (deliberately denormalized minimally;
# the admin API joins the customer's name in at the service layer instead of
# duplicating it here on every row).

create_booking: |
  INSERT INTO divine_bookings(
    id, payment_id, inventory_id, customer_id, project_name, unit_number, amount,
    status, kyc_status, version, created_date, last_updated_date
  )
  VALUES (
    :id, :payment_id, :inventory_id, :customer_id, :project_name, :unit_number, :amount,
    :status, :kyc_status, :version, :created_date, :last_updated_date
  )
  RETURNING *;

get_by_id: |
  SELECT * FROM divine_bookings WHERE id = :id LIMIT 1;

get_by_payment_id: |
  SELECT * FROM divine_bookings WHERE payment_id = :payment_id LIMIT 1;

list_queue: |
  WITH filtered AS (
    SELECT * FROM divine_bookings
    WHERE (:search IS NULL
           OR lower(id) LIKE '%' || replace(replace(lower(:search), '%', '\%'), '_', '\_') || '%' ESCAPE '\'
           OR lower(customer_id) LIKE '%' || replace(replace(lower(:search), '%', '\%'), '_', '\_') || '%' ESCAPE '\'
           OR lower(project_name) LIKE '%' || replace(replace(lower(:search), '%', '\%'), '_', '\_') || '%' ESCAPE '\')
      AND (:status IS NULL OR status = :status)
      AND (:kyc_status IS NULL OR kyc_status = :kyc_status)
  )
  SELECT *, count(*) OVER() AS total_count FROM filtered
  ORDER BY created_date DESC
  LIMIT :limit OFFSET :offset;

count_queue: |
  SELECT count(*) AS total FROM divine_bookings
  WHERE (:search IS NULL
         OR lower(id) LIKE '%' || replace(replace(lower(:search), '%', '\%'), '_', '\_') || '%' ESCAPE '\'
         OR lower(customer_id) LIKE '%' || replace(replace(lower(:search), '%', '\%'), '_', '\_') || '%' ESCAPE '\'
         OR lower(project_name) LIKE '%' || replace(replace(lower(:search), '%', '\%'), '_', '\_') || '%' ESCAPE '\')
    AND (:status IS NULL OR status = :status)
    AND (:kyc_status IS NULL OR kyc_status = :kyc_status);

list_by_customer: |
  SELECT * FROM divine_bookings WHERE customer_id = :customer_id ORDER BY created_date DESC;

# Optimistic-locked transition: only matches (and bumps version by 1) when the
# row's version still equals :expected_version. Zero rows back means either the
# booking doesn't exist, or someone else already changed it since the caller
# last read it.
update_decision: |
  UPDATE divine_bookings
  SET status = :status, kyc_status = :kyc_status, admin_note = :admin_note,
      version = version + 1, last_updated_date = :last_updated_date
  WHERE id = :id AND version = :expected_version
  RETURNING *;

insert_decision: |
  INSERT INTO divine_booking_decisions(id, booking_id, actor, action, note, created_date)
  VALUES (:id, :booking_id, :actor, :action, :note, :created_date)
  RETURNING *;

list_decisions: |
  SELECT * FROM divine_booking_decisions WHERE booking_id = :booking_id ORDER BY created_date ASC;

# --- Admin KYC document upload (POST /admin/bookings/{id}/documents/{type}) ---

# Same optimistic lock as update_decision, plus the booking must still be in
# :status - re-checked atomically at commit time. Leaves status/kyc_status
# untouched: uploading a document never approves anything.
bump_version_if_status: |
  UPDATE divine_bookings
  SET version = version + 1, last_updated_date = :last_updated_date
  WHERE id = :id AND version = :expected_version AND status = :status
  RETURNING *;

# No-op UPDATEs used purely as portable row locks (Postgres holds the row lock
# until commit; no FOR UPDATE, which SQLite lacks). Serializes concurrent
# uploads by one admin / for one customer so the in-transaction rate-limit
# counts and previous-document lookup are exact.
lock_admin_row: |
  UPDATE divine_admin_users SET last_updated_date = last_updated_date WHERE id = :id;

lock_customer_row: |
  UPDATE divine_customer_users SET last_updated_date = last_updated_date WHERE id = :id;

lock_broker_row: |
  UPDATE divine_broker_users SET last_updated_date = last_updated_date WHERE id = :id;

# KYC documents belong to the customer, not to one booking - a document
# uploaded via booking A is also what the owner's other bookings under review
# now show. Bump their versions too, so an admin approving one of them from a
# page loaded before the change gets a version_conflict instead of approving
# documents they never saw.
bump_sibling_pending_bookings: |
  UPDATE divine_bookings
  SET version = version + 1, last_updated_date = :last_updated_date
  WHERE customer_id = :customer_id AND status = :status AND id <> :id
  RETURNING id;

insert_document_upload: |
  INSERT INTO divine_booking_document_uploads(
    id, booking_id, admin_id, document_type, document_id, previous_document_id, idempotency_key,
    request_fingerprint, request_id, note, byte_size, content_sha256, created_date
  )
  VALUES (
    :id, :booking_id, :admin_id, :document_type, :document_id, :previous_document_id, :idempotency_key,
    :request_fingerprint, :request_id, :note, :byte_size, :content_sha256, :created_date
  )
  RETURNING *;

get_document_upload_by_key: |
  SELECT * FROM divine_booking_document_uploads
  WHERE admin_id = :admin_id AND idempotency_key = :idempotency_key LIMIT 1;

count_recent_document_uploads: |
  SELECT
    (SELECT count(*) FROM divine_booking_document_uploads
     WHERE admin_id = :admin_id AND created_date >= :admin_since) AS by_admin,
    (SELECT count(*) FROM divine_booking_document_uploads
     WHERE booking_id = :booking_id AND created_date >= :booking_since) AS by_booking;
